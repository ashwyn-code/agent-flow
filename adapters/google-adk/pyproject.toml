[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-flow-adk"
version = "0.1.0"
description = "Stream Google ADK runs into the Agent Flow visualizer"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = ["google-adk>=1.5"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["agent_flow_adk"]
