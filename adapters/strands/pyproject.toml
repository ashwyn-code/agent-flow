[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-flow-strands"
version = "0.1.0"
description = "Stream Strands Agents runs into the Agent Flow visualizer"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = ["strands-agents>=1.10"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["agent_flow_strands"]
