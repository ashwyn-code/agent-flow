[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-flow-agent-framework"
version = "0.1.0"
description = "Stream Microsoft Agent Framework runs into the Agent Flow visualizer"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = ["agent-framework-core>=1.0"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["agent_flow_agent_framework"]
